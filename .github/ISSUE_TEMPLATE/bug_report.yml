name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of ./scripts/doctor.sh
      description: It shows versions, field names and status values, never paths or conversation content. Please read it before pasting.
      render: text
    validations:
      required: true
